openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gps
    description: GPS / One-Step GPS operations
  - name: projects
    description: Project management
  - name: teamLeaders
    description: Team leader management
  - name: logEntries
    description: Mileage log entry management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gps/devices:
    get:
      operationId: getGpsDevices
      tags: [gps]
      summary: List GPS devices (trucks)
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsDevice"

  /gps/mileage-summary:
    get:
      operationId: getMileageSummary
      tags: [gps]
      summary: Get daily mileage summary for a truck
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily mileage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MileageSummary"

  /gps/odometer-range:
    get:
      operationId: getOdometerRange
      tags: [gps]
      summary: Get first and last odometer reading for a truck over a date range
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Odometer range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdometerRange"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /team-leaders:
    get:
      operationId: listTeamLeaders
      tags: [teamLeaders]
      summary: List all team leaders
      responses:
        "200":
          description: List of team leaders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamLeader"
    post:
      operationId: createTeamLeader
      tags: [teamLeaders]
      summary: Create a new team leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamLeaderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLeader"

  /log-entries:
    get:
      operationId: listLogEntries
      tags: [logEntries]
      summary: List all mileage log entries
      responses:
        "200":
          description: List of log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    post:
      operationId: createLogEntry
      tags: [logEntries]
      summary: Create a mileage log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntry"

  /log-entries/{id}:
    delete:
      operationId: deleteLogEntry
      tags: [logEntries]
      summary: Delete a log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GpsDevice:
      type: object
      required:
        - device_id
        - display_name
        - active_state
      properties:
        device_id:
          type: string
        display_name:
          type: string
        active_state:
          type: string

    OdometerRange:
      type: object
      required:
        - device_id
        - from
        - to
        - begin_odometer_miles
        - end_odometer_miles
        - total_miles
      properties:
        device_id:
          type: string
        from:
          type: string
        to:
          type: string
        begin_odometer_miles:
          type: number
        end_odometer_miles:
          type: number
        total_miles:
          type: number

    DailyMileage:
      type: object
      required:
        - date
        - start_odometer_miles
        - end_odometer_miles
        - miles_driven
      properties:
        date:
          type: string
        start_odometer_miles:
          type: number
        end_odometer_miles:
          type: number
        miles_driven:
          type: number

    MileageSummary:
      type: object
      required:
        - device_id
        - display_name
        - from
        - to
        - total_miles
        - daily_logs
      properties:
        device_id:
          type: string
        display_name:
          type: string
        from:
          type: string
        to:
          type: string
        total_miles:
          type: number
        daily_logs:
          type: array
          items:
            $ref: "#/components/schemas/DailyMileage"

    Project:
      type: object
      required:
        - id
        - project_number
        - created_at
      properties:
        id:
          type: integer
        project_number:
          type: string
        created_at:
          type: string

    ProjectInput:
      type: object
      required:
        - project_number
      properties:
        project_number:
          type: string

    TeamLeader:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string

    TeamLeaderInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    LogEntry:
      type: object
      required:
        - id
        - device_id
        - device_name
        - start_date
        - end_date
        - begin_odometer
        - end_odometer
        - indirect_miles
        - personal_miles
        - direct_miles
        - total_miles
        - project_number
        - team_leader_name
        - created_at
      properties:
        id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        begin_odometer:
          type: number
        end_odometer:
          type: number
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        total_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
        created_at:
          type: string

    LogEntryInput:
      type: object
      required:
        - device_id
        - device_name
        - start_date
        - end_date
        - begin_odometer
        - end_odometer
        - indirect_miles
        - personal_miles
        - direct_miles
        - project_number
        - team_leader_name
      properties:
        device_id:
          type: string
        device_name:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        begin_odometer:
          type: number
        end_odometer:
          type: number
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
