openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: gps
  - name: projects
  - name: teamLeaders
  - name: periods
  - name: annotations
  - name: config
  - name: driverSessions
  - name: reports
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gps/devices:
    get:
      operationId: getGpsDevices
      tags: [gps]
      summary: List GPS devices (trucks)
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsDevice"

  /gps/mileage-summary:
    get:
      operationId: getMileageSummary
      tags: [gps]
      summary: Get daily mileage summary for a truck
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily mileage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MileageSummary"

  /gps/odometer-range:
    get:
      operationId: getOdometerRange
      tags: [gps]
      summary: Get first and last odometer reading for a truck over a date range
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Odometer range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdometerRange"

  /gps/cache/sync:
    post:
      operationId: syncGpsCache
      tags: [gps]
      summary: Fetch GPS data from One-Step GPS API and persist in database cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GpsCacheSyncInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpsCacheSyncResult"

  /gps/cache:
    get:
      operationId: getGpsCache
      tags: [gps]
      summary: Query cached GPS data from database
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: "device_ids[]"
          in: query
          schema:
            type: array
            items:
              type: string
          explode: true
      responses:
        "200":
          description: Cached GPS entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsCacheEntry"

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Combined report — GPS cache joined with annotations, filterable
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: "device_ids[]"
          in: query
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: project
          in: query
          schema:
            type: string
        - name: leader
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportRow"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /team-leaders:
    get:
      operationId: listTeamLeaders
      tags: [teamLeaders]
      summary: List all team leaders
      responses:
        "200":
          description: List of team leaders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamLeader"
    post:
      operationId: createTeamLeader
      tags: [teamLeaders]
      summary: Create a new team leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamLeaderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLeader"

  /periods:
    get:
      operationId: listPeriods
      tags: [periods]
      summary: List all periods
      responses:
        "200":
          description: List of periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Period"
    post:
      operationId: getOrCreatePeriod
      tags: [periods]
      summary: Get or create a period by month_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodInput"
      responses:
        "201":
          description: Created or fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Period"

  /periods/{id}/annotations:
    get:
      operationId: listPeriodAnnotations
      tags: [periods]
      summary: List all annotations for a period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of annotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annotation"

  /periods/{id}/finalize:
    post:
      operationId: finalizePeriod
      tags: [periods]
      summary: Finalize (lock) a period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finalized period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Period"

  /periods/{id}/mark-exported:
    post:
      operationId: markAnnotationsExported
      tags: [periods]
      summary: Mark annotations as exported
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkExportedInput"
      responses:
        "200":
          description: Number of rows updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkExportedResult"

  /annotations:
    post:
      operationId: upsertAnnotation
      tags: [annotations]
      summary: Create or update a row annotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationInput"
      responses:
        "201":
          description: Upserted annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "403":
          description: Period is finalized and no valid manager token provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /annotations/{id}:
    delete:
      operationId: deleteAnnotation
      tags: [annotations]
      summary: Delete a single annotation record (e.g. to remove a saved split row)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateAnnotation
      tags: [annotations]
      summary: Update an annotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationUpdate"
      responses:
        "200":
          description: Updated annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
        "403":
          description: Period is finalized and no valid manager token provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver-sessions:
    get:
      operationId: listDriverSessions
      tags: [driverSessions]
      summary: List driver sessions, optionally filtered by date range and/or device
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: "Start date (YYYY-MM-DD)"
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: "End date (YYYY-MM-DD)"
        - name: device_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of driver sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverSession"
    post:
      operationId: startDriverSession
      tags: [driverSessions]
      summary: Start a new driver shift session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverSession"

  /driver-sessions/{id}/end:
    patch:
      operationId: endDriverSession
      tags: [driverSessions]
      summary: End an active driver shift session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ended session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverSession"
        "404":
          description: Session not found or already ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /config/manager-password:
    get:
      operationId: checkManagerPassword
      tags: [config]
      summary: Check whether a password matches the manager secret (compatibility alias). Pass password as Authorization Bearer token.
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: "Bearer <password>"
      responses:
        "200":
          description: Whether the password is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordCheckResult"

  /config/verify-password:
    post:
      operationId: verifyManagerPassword
      tags: [config]
      summary: Verify the manager password and receive a short-lived unlock token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordVerifyInput"
      responses:
        "200":
          description: Verification result (token is null when password is wrong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordVerifyResult"

  /settings/truck-states:
    get:
      operationId: listTruckStates
      tags: [settings]
      summary: List truck state assignments
      responses:
        "200":
          description: Truck states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TruckState"
    put:
      operationId: saveTruckStates
      tags: [settings]
      summary: Save truck state assignments (full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TruckState"
      responses:
        "200":
          description: Saved

  /settings/project-states:
    get:
      operationId: listProjectStates
      tags: [settings]
      summary: List project state assignments
      responses:
        "200":
          description: Project states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectState"
    put:
      operationId: saveProjectStates
      tags: [settings]
      summary: Save project state assignments (full replace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProjectState"
      responses:
        "200":
          description: Saved

  /settings/state-contacts:
    get:
      operationId: listStateContacts
      tags: [settings]
      summary: List state contacts
      responses:
        "200":
          description: State contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateContact"
    post:
      operationId: createStateContact
      tags: [settings]
      summary: Add a state contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateContact"

  /settings/state-contacts/{id}:
    delete:
      operationId: deleteStateContact
      tags: [settings]
      summary: Delete a state contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GpsDevice:
      type: object
      required: [device_id, display_name, active_state]
      properties:
        device_id:
          type: string
        display_name:
          type: string
        active_state:
          type: string

    OdometerRange:
      type: object
      required: [device_id, from, to, begin_odometer_miles, end_odometer_miles, total_miles]
      properties:
        device_id:
          type: string
        from:
          type: string
        to:
          type: string
        begin_odometer_miles:
          type: number
        end_odometer_miles:
          type: number
        total_miles:
          type: number

    DailyMileage:
      type: object
      required: [date, start_odometer_miles, end_odometer_miles, miles_driven]
      properties:
        date:
          type: string
        start_odometer_miles:
          type: number
        end_odometer_miles:
          type: number
        miles_driven:
          type: number

    MileageSummary:
      type: object
      required: [device_id, display_name, from, to, total_miles, daily_logs]
      properties:
        device_id:
          type: string
        display_name:
          type: string
        from:
          type: string
        to:
          type: string
        total_miles:
          type: number
        daily_logs:
          type: array
          items:
            $ref: "#/components/schemas/DailyMileage"

    Project:
      type: object
      required: [id, project_number, created_at]
      properties:
        id:
          type: integer
        project_number:
          type: string
        created_at:
          type: string

    ProjectInput:
      type: object
      required: [project_number]
      properties:
        project_number:
          type: string

    TeamLeader:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string

    TeamLeaderInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Period:
      type: object
      required: [id, label, month_key, finalized, created_at]
      properties:
        id:
          type: integer
        label:
          type: string
        month_key:
          type: string
        finalized:
          type: boolean
        finalized_at:
          type: string
          nullable: true
        created_at:
          type: string

    PeriodInput:
      type: object
      required: [month_key]
      properties:
        month_key:
          type: string

    Annotation:
      type: object
      required: [id, period_id, device_id, device_name, date, split_index, indirect_miles, personal_miles, direct_miles, project_number, team_leader_name, is_exported]
      properties:
        id:
          type: integer
        period_id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        date:
          type: string
        split_index:
          type: integer
        begin_odometer:
          type: number
          nullable: true
        end_odometer:
          type: number
          nullable: true
        gps_miles:
          type: number
          nullable: true
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
        is_exported:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    AnnotationInput:
      type: object
      required: [period_id, device_id, date]
      properties:
        period_id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        date:
          type: string
        split_index:
          type: integer
        begin_odometer:
          type: number
          nullable: true
        end_odometer:
          type: number
          nullable: true
        gps_miles:
          type: number
          nullable: true
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
        manager_token:
          type: string
          nullable: true
          description: Required when the target period is finalized. Obtained from /config/verify-password.

    AnnotationUpdate:
      type: object
      properties:
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
        manager_token:
          type: string
          nullable: true
          description: Required when the annotation belongs to a finalized period. Obtained from /config/verify-password.

    MarkExportedInput:
      type: object
      required: [annotation_ids]
      properties:
        annotation_ids:
          type: array
          items:
            type: integer

    MarkExportedResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer

    PasswordCheckResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    PasswordVerifyInput:
      type: object
      required: [password, period_id]
      properties:
        password:
          type: string
        period_id:
          type: integer
          description: The period ID being unlocked. The returned token is scoped to this period only.

    PasswordVerifyResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        token:
          type: string
          nullable: true
          description: Short-lived HMAC-signed token authorizing writes to the specified period. Null when password is incorrect.

    DriverSession:
      type: object
      required: [id, driver_name, device_id, project_number, started_at, created_at]
      properties:
        id:
          type: integer
        driver_name:
          type: string
        device_id:
          type: string
        project_number:
          type: string
        started_at:
          type: string
        ended_at:
          type: string
          nullable: true
        created_at:
          type: string

    DriverSessionInput:
      type: object
      required: [driver_name, device_id]
      properties:
        driver_name:
          type: string
        device_id:
          type: string
        project_number:
          type: string
        shift_date:
          type: string
          description: "Date to backdate the shift to (YYYY-MM-DD). Defaults to today if omitted."

    GpsCacheEntry:
      type: object
      required: [device_id, device_name, date, begin_odometer, end_odometer, gps_miles]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        date:
          type: string
        begin_odometer:
          type: number
        end_odometer:
          type: number
        gps_miles:
          type: number
        fetched_at:
          type: string
          nullable: true

    GpsCacheSyncInput:
      type: object
      required: [device_ids, from, to]
      properties:
        device_ids:
          type: array
          items:
            type: string
        from:
          type: string
        to:
          type: string
        force:
          type: boolean

    GpsCacheSyncResult:
      type: object
      required: [synced, skipped]
      properties:
        synced:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string

    ReportRow:
      type: object
      required: [device_id, device_name, date, indirect_miles, personal_miles, direct_miles, project_number, team_leader_name, is_exported, split_index]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        date:
          type: string
        begin_odometer:
          type: number
          nullable: true
        end_odometer:
          type: number
          nullable: true
        gps_miles:
          type: number
          nullable: true
        indirect_miles:
          type: number
        personal_miles:
          type: number
        direct_miles:
          type: number
        project_number:
          type: string
        team_leader_name:
          type: string
        is_exported:
          type: boolean
        split_index:
          type: integer
        annotation_id:
          type: integer
          nullable: true
        period_id:
          type: integer
          nullable: true

    TruckState:
      type: object
      required: [device_id, device_name, state_code]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        state_code:
          type: string

    ProjectState:
      type: object
      required: [project_number, state_code]
      properties:
        project_number:
          type: string
        state_code:
          type: string

    StateContact:
      type: object
      required: [id, state_code, contact_name, email]
      properties:
        id:
          type: integer
        state_code:
          type: string
        contact_name:
          type: string
        email:
          type: string

    StateContactInput:
      type: object
      required: [state_code, contact_name, email]
      properties:
        state_code:
          type: string
        contact_name:
          type: string
        email:
          type: string
