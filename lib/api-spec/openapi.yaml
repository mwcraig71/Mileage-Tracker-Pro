openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gps
    description: GPS / One-Step GPS operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gps/devices:
    get:
      operationId: getGpsDevices
      tags: [gps]
      summary: List GPS devices (trucks)
      description: Returns all active GPS-tracked trucks from One-Step GPS
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GpsDevice"

  /gps/device-points:
    get:
      operationId: getDevicePoints
      tags: [gps]
      summary: Get GPS device points for a date range
      description: Returns GPS data points with odometer readings for a given truck over a date range
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
          description: Device ID of the truck
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: ISO 8601 start datetime (e.g. 2024-01-01T00:00:00Z)
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: ISO 8601 end datetime (e.g. 2024-01-31T23:59:59Z)
      responses:
        "200":
          description: List of device points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DevicePoint"

  /gps/mileage-summary:
    get:
      operationId: getMileageSummary
      tags: [gps]
      summary: Get daily mileage summary for a truck
      description: Computes daily mileage from odometer readings and returns a structured log
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
          description: Device ID of the truck
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: ISO 8601 start date (e.g. 2024-01-01)
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: ISO 8601 end date (e.g. 2024-01-31)
      responses:
        "200":
          description: Daily mileage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MileageSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GpsDevice:
      type: object
      required:
        - device_id
        - display_name
        - active_state
      properties:
        device_id:
          type: string
        display_name:
          type: string
        active_state:
          type: string

    DevicePoint:
      type: object
      required:
        - device_point_id
        - dt_tracker
        - lat
        - lng
      properties:
        device_point_id:
          type: string
        dt_tracker:
          type: string
        lat:
          type: number
        lng:
          type: number
        odometer_miles:
          type: ["number", "null"]

    DailyMileage:
      type: object
      required:
        - date
        - start_odometer_miles
        - end_odometer_miles
        - miles_driven
      properties:
        date:
          type: string
          description: Calendar date YYYY-MM-DD
        start_odometer_miles:
          type: number
        end_odometer_miles:
          type: number
        miles_driven:
          type: number

    MileageSummary:
      type: object
      required:
        - device_id
        - display_name
        - from
        - to
        - total_miles
        - daily_logs
      properties:
        device_id:
          type: string
        display_name:
          type: string
        from:
          type: string
        to:
          type: string
        total_miles:
          type: number
        daily_logs:
          type: array
          items:
            $ref: "#/components/schemas/DailyMileage"
